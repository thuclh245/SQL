# Trino một node (vừa coordinator vừa worker) cho lab.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
catalog.management=static

# Chặn truy vấn chạy quá lâu ở mức engine; executor của ứng dụng còn đặt
# query_max_execution_time theo từng phiên, giá trị nào nhỏ hơn sẽ thắng.
query.max-execution-time=5m
query.max-run-time=6m
query.max-memory=4GB
query.max-memory-per-node=1GB
