# Catalog đặt tên "hive" để đường dẫn ba phần khớp mẫu VTNet Datalake (Presto.hive.<schema>.<table>).
connector.name=hive
hive.metastore=thrift
hive.metastore.uri=thrift://hive-metastore:9083

# Trino 477 dùng filesystem S3 gốc, không cần jar hadoop-aws ở phía Trino.
fs.native-s3.enabled=true
s3.endpoint=${ENV:S3_ENDPOINT}
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}

# Bảng của lab đều là external và nằm trên object storage.
hive.non-managed-table-writes-enabled=true
hive.recursive-directories=true
