# Telecom lakehouse lab — mô phỏng đường đi Presto.hive của VTNet Datalake.
# Mọi image khóa version; không dùng tag "latest".
#
# Khởi động:  docker compose --env-file .env up -d minio metastore-db hive-metastore trino
# Nạp dữ liệu: xem README.md (stage -> mirror -> load -> verify)
name: telecom_lab

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: telecom_lab_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    # Chỉ mở console ra loopback của host; cổng S3 (9000) không publish.
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks: [telecom_lab]

  # Job một lần: tạo bucket và đẩy CSV đã staging lên object storage.
  # Chạy bằng:  docker compose run --rm minio-load
  minio-load:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: telecom_lab_minio_load
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
    entrypoint: ["/bin/sh", "/opt/scripts/mirror_stage.sh"]
    volumes:
      - ./scripts/mirror_stage.sh:/opt/scripts/mirror_stage.sh:ro
      - ./.stage:/stage:ro
    profiles: ["load"]
    networks: [telecom_lab]

  metastore-db:
    image: postgres:16-alpine
    container_name: telecom_lab_metastore_db
    environment:
      POSTGRES_DB: ${METASTORE_DB_NAME:-metastore}
      POSTGRES_USER: ${METASTORE_DB_USER:?METASTORE_DB_USER is required}
      POSTGRES_PASSWORD: ${METASTORE_DB_PASSWORD:?METASTORE_DB_PASSWORD is required}
    volumes:
      - metastore-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METASTORE_DB_USER:-hive} -d ${METASTORE_DB_NAME:-metastore}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [telecom_lab]

  hive-metastore:
    build:
      context: ./metastore
      dockerfile: Dockerfile
    image: telecom-lab/hive-metastore:4.1.0-s3
    container_name: telecom_lab_hive_metastore
    depends_on:
      metastore-db:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      METASTORE_DB_HOSTNAME: metastore-db
      # Đọc bởi metastore-site.xml qua biến môi trường Hadoop conf.
      HIVE_METASTORE_DB_URL: jdbc:postgresql://metastore-db:5432/${METASTORE_DB_NAME:-metastore}
      HIVE_METASTORE_DB_USER: ${METASTORE_DB_USER:?METASTORE_DB_USER is required}
      HIVE_METASTORE_DB_PASSWORD: ${METASTORE_DB_PASSWORD:?METASTORE_DB_PASSWORD is required}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - ./metastore/metastore-site.xml:/opt/hive/conf/metastore-site.xml:ro
      - metastore-warehouse:/opt/hive/data/warehouse
    expose:
      - "9083"
    restart: unless-stopped
    networks: [telecom_lab]

  trino:
    image: trinodb/trino:477
    container_name: telecom_lab_trino
    depends_on:
      hive-metastore:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
    volumes:
      # Chỉ thay các file cần đổi; jvm.config và log.properties giữ nguyên của image.
      - ./trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./trino/etc/access-control.properties:/etc/trino/access-control.properties:ro
      - ./trino/etc/rules.json:/etc/trino/rules.json:ro
      - ./trino/catalog/hive.properties:/etc/trino/catalog/hive.properties:ro
      - trino-data:/data/trino
    ports:
      - "127.0.0.1:${TRINO_HOST_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s
    restart: unless-stopped
    networks: [telecom_lab]

volumes:
  minio-data: {}
  metastore-db-data: {}
  metastore-warehouse: {}
  trino-data: {}

networks:
  telecom_lab:
    name: telecom_lab
